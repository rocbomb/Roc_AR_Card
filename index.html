<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR动漫卡片召唤器</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.min.js"></script>
    <style>
        /* 加载界面 */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            font-family: Arial, sans-serif;
        }
        #loading-overlay.hidden {
            display: none;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading-text {
            font-size: 18px;
            margin-bottom: 10px;
        }
        #loading-progress {
            font-size: 14px;
            color: #888;
        }
        /* 提示信息 */
        #hint-overlay {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 100;
            transition: opacity 0.3s;
        }
        #hint-overlay.hidden {
            opacity: 0;
        }
        /* 调试面板 */
        #debug-panel {
            position: fixed;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 6px 8px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 10px;
            z-index: 100;
            max-width: 150px;
        }
        #debug-panel.hidden {
            display: none;
        }
        /* 日志面板 */
        #log-panel {
            position: fixed;
            bottom: 50px;
            left: 6px;
            right: 6px;
            max-height: 140px;
            background: rgba(0, 0, 0, 0.85);
            color: #00ff00;
            padding: 6px 8px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 9px;
            z-index: 100;
            overflow-y: auto;
            line-height: 1.3;
        }
        #log-panel.hidden {
            display: none;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- 加载界面 -->
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div id="loading-text">正在加载 AR 场景...</div>
        <div id="loading-progress">初始化中</div>
    </div>

    <!-- 用户提示 -->
    <div id="hint-overlay">请将摄像头对准卡片</div>

    <!-- 调试面板 -->
    <div id="debug-panel" class="hidden">
        <div>已识别卡片: <span id="debug-detected">无</span></div>
        <div>跟踪状态: <span id="debug-tracking">未跟踪</span></div>
    </div>

    <!-- 日志面板 -->
    <div id="log-panel"></div>

    <!-- AR 场景 -->
    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: false; precision: medium; antialias: false;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;"
        gesture-detector
    >
        <!-- 资源预加载 -->
        <a-assets>
            <a-asset-item id="model-2" src="./assets/models/2.glb"></a-asset-item>
            <a-asset-item id="model-3" src="./assets/models/3.glb"></a-asset-item>
            <a-asset-item id="model-4" src="./assets/models/4.glb"></a-asset-item>
        </a-assets>

        <!-- 卡片2 的 NFT Marker -->
        <a-nft
            type="nft"
            url="./assets/markers/2"
            smooth="true"
            smoothCount="3"
            smoothTolerance="0.01"
            smoothThreshold="2"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
        >
            <!-- position="0 0 0" 模型在卡片中心，scale调整大小，动画做小范围悬浮 -->
            <a-entity
                id="model-entity-2"
                gltf-model="#model-2"
                position="0 0 0"
                scale="50 50 50"
                rotation="-90 0 0"
                class="clickable"
                animation__float="property: position; to: 0 0.1 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine; enabled: false"
            >
            </a-entity>
            <a-box id="marker-helper-2" color="#ff4444" opacity="0.35" depth="150" width="150" height="10" position="0 0 0" visible="false"></a-box>
            <a-box id="fallback-2" color="#ffffff" opacity="0.6" depth="50" width="50" height="50" position="0 50 0" visible="false"></a-box>
        </a-nft>

        <!-- 卡片3 的 NFT Marker -->
        <a-nft
            type="nft"
            url="./assets/markers/3"
            smooth="true"
            smoothCount="3"
            smoothTolerance="0.01"
            smoothThreshold="2"
        >
            <a-entity
                id="model-entity-3"
                gltf-model="#model-3"
                position="0 0 0"
                scale="150 150 150"
                rotation="-90 0 0"
                animation__float="property: position; to: 0 0.1 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine; enabled: false"
            >
            </a-entity>
            <a-box id="marker-helper-3" color="#44ff44" opacity="0.35" depth="150" width="150" height="10" position="0 0 0" visible="false"></a-box>
            <a-box id="fallback-3" color="#ffffff" opacity="0.6" depth="50" width="50" height="50" position="0 50 0" visible="false"></a-box>
        </a-nft>

        <!-- 卡片4 的 NFT Marker -->
        <a-nft
            type="nft"
            url="./assets/markers/4"
            smooth="true"
            smoothCount="3"
            smoothTolerance="0.01"
            smoothThreshold="2"
        >
            <a-entity
                id="model-entity-4"
                gltf-model="#model-4"
                position="0 0 0"
                scale="150 150 150"
                rotation="-90 0 0"
                animation__float="property: position; to: 0 0.1 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine; enabled: false"
            >
            </a-entity>
            <a-box id="marker-helper-4" color="#4444ff" opacity="0.35" depth="150" width="150" height="10" position="0 0 0" visible="false"></a-box>
            <a-box id="fallback-4" color="#ffffff" opacity="0.6" depth="50" width="50" height="50" position="0 50 0" visible="false"></a-box>
        </a-nft>

        <!-- 摄像头 -->
        <a-entity id="camera" camera>
            <a-plane id="hud-debug" color="#ffcc00" opacity="0.7" width="0.15" height="0.08" position="0 0 -0.5" visible="false"></a-plane>
            <!-- 调试：在摄像头前方固定一个红色小方块，验证3D渲染层是否正常工作 -->
            <!-- 用户反馈看不到红色方块，但看到了灰色方块（fallback），说明渲染正常但FOV可能有问题，或者被遮挡。既然渲染OK，移除这个干扰项 -->
            <!-- <a-box id="camera-fix-debug" color="red" depth="0.02" width="0.02" height="0.02" position="0.2 0.2 -0.5" visible="true"></a-box> -->
        </a-entity>
    </a-scene>

    <script>
        // ========== 日志工具 ==========
        function log(tag, msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const prefix = `[${time}][${tag}]`;
            const style = {
                info: 'color: #00ff00',
                warn: 'color: #ffaa00',
                error: 'color: #ff0000',
                load: 'color: #00aaff'
            };
            console.log(`%c${prefix} ${msg}`, style[type] || style.info);
            
            addLogToPanel(`[${tag}] ${msg}`, type);
        }

        function addLogToPanel(msg, type) {
            if (!PERF.logPanelEnabled) return;
            const now = Date.now();
            if (now - lastLogPanelTime < PERF.logPanelThrottleMs) return;
            lastLogPanelTime = now;
            const panel = document.getElementById('log-panel');
            if (!panel) return;
            const line = document.createElement('div');
            line.textContent = msg;
            line.style.color = type === 'error' ? '#ff4444' : type === 'warn' ? '#ffaa00' : '#00ff00';
            panel.appendChild(line);
            panel.scrollTop = panel.scrollHeight;
            while (panel.children.length > PERF.maxLogLines) {
                panel.removeChild(panel.firstChild);
            }
        }

        // ========== 配置参数 ==========
        const CONFIG = {
            models: {
                // 尝试将模型移动到中心 (假设卡片宽高比约为 1.5:1, 且单位为归一化或像素)
                // 如果之前 targetSize=0.2 合适，说明单位是小数值，那么 position 应该也是小数值
                // 假设卡片宽度为 1，则中心在 0.5 左右
                2: { position: '100 150 0', scale: '150 150 150', rotation: '-90 0 0' },
                3: { position: '100 150 0', scale: '150 150 150', rotation: '-90 0 0' },
                4: { position: '100 150 0', scale: '150 150 150', rotation: '-90 0 0' }
            },
            tracking: {
                smooth: true,
                smoothCount: 10,
                smoothTolerance: 0.01,
                smoothThreshold: 5
            },
            debug: true  // 开启调试
        };
        const PERF = {
            logPanelEnabled: true,
            logPanelThrottleMs: 120,
            debugPanelThrottleMs: 120,
            maxLogLines: 30
        };

        // ========== 加载状态管理 ==========
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const loadingProgress = document.getElementById('loading-progress');
        const hintOverlay = document.getElementById('hint-overlay');
        const debugPanel = document.getElementById('debug-panel');
        const debugDetected = document.getElementById('debug-detected');
        const debugTracking = document.getElementById('debug-tracking');
        const hudDebug = document.getElementById('hud-debug');

        if (CONFIG.debug) {
            debugPanel.classList.remove('hidden');
        }

        let detectedMarkers = new Set();
        let lastLogPanelTime = 0;
        let lastDebugUpdateTime = 0;

        // ========== 场景加载事件 ==========
        const scene = document.querySelector('a-scene');
        
        scene.addEventListener('loaded', () => {
            log('Scene', '场景已加载', 'load');
            loadingProgress.textContent = '场景已加载';
        });

        scene.addEventListener('arjs-video-loaded', () => {
            log('AR.js', '摄像头已就绪', 'load');
            loadingProgress.textContent = '摄像头已就绪';
        });

        // ========== 资源加载监听 ==========
        const assets = document.querySelector('a-assets');
        if (assets) {
            assets.addEventListener('loaded', () => {
                log('Assets', '所有资源预加载完成', 'load');
            });
        }

        // 监听每个模型资源
        ['model-2', 'model-3', 'model-4'].forEach(id => {
            const asset = document.getElementById(id);
            if (asset) {
                asset.addEventListener('loaded', () => {
                    log('Model', `${id} 加载成功 ✓`, 'load');
                });
                asset.addEventListener('error', (e) => {
                    log('Model', `${id} 加载失败 ✗: ${e.detail || '未知错误'}`, 'error');
                });
            } else {
                log('Model', `${id} 资源元素不存在`, 'warn');
            }
        });

        function alignModelToMarker(entityId) {
            const entity = document.getElementById(entityId);
            if (!entity) return;
            
            // 解析 Marker ID
            const markerId = entityId.split('-').pop();
            const config = CONFIG.models[markerId];

            // 尝试获取模型对象 (兼容 gltf-model 和普通 geometry)
            let mesh = entity.getObject3D('mesh');
            if (!mesh && entity.object3D.children.length > 0) {
                // 如果没有注册为 'mesh'，则取第一个子对象（通常是 GLTF 根节点）
                mesh = entity.object3D;
            }

            if (!mesh) {
                log('Center', `${entityId} 模型对象未就绪`, 'warn');
                return;
            }
            
            mesh.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(mesh);
            if (box.isEmpty()) {
                log('Center', `${entityId} 包围盒为空`, 'warn');
                return;
            }
            
            // 计算中心点偏移
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            // 读取配置中的位置偏移（如果没有配置，默认为 0 0 0）
            let targetPos = new THREE.Vector3(0, 0, 0);
            if (config && config.position) {
                const parts = config.position.trim().split(/\s+/).map(Number);
                if (parts.length === 3 && !parts.some(isNaN)) {
                    targetPos.set(parts[0], parts[1], parts[2]);
                }
            }

            // 应用位置偏移
            // 假设 (0,0,0) 是左下角，我们需要往右上移动到中心
            entity.object3D.position.copy(targetPos);
            
            // 缩放逻辑
            const maxDim = Math.max(size.x, size.y, size.z);
            
            // 目标大小：0.2 (像素/单位)
            const targetSize = 0.2; 
                
            // 如果 maxDim 非常小（例如 < 1），说明模型本身单位是米，需要放大
            // 如果 maxDim 很大（例如 > 100），说明模型本身单位匹配，不需要太大缩放
            
            let scale = 1;
            if (maxDim > 0) {
                scale = targetSize / maxDim;
            }
            
            // 限制缩放范围，防止数值爆炸
            // 将最大缩放限制从 10000 降低到 100，防止模型意外变得过大
            const clampedScale = Math.min(Math.max(scale, 0.001), 100);
            
            entity.object3D.scale.set(clampedScale, clampedScale, clampedScale);
            
            // 修正位置：让模型底部位于 z=0 (或 y=0，取决于坐标系)
            // AR.js NFT 通常 z 是垂直于卡片的轴？不，通常 y 是垂直的，或者 z。
            // 这里的 entity 有 rotation="-90 0 0"，这意味着原始的 z 轴变成了 y 轴 (垂直于卡片)。
            // 原始模型的 y 轴变成了 -z 轴 (卡片平面)。
            // 我们希望模型“站”在卡片上。
            
            // 简单的可见性修复：
            entity.object3D.visible = true;
            
            log('Center', `${entityId} 调整完成: Pos=${targetPos.toArray().join(',')}, Scale=${clampedScale.toFixed(2)}`, 'info');
        }

        // ========== 模型实体加载监听 ==========
        ['model-entity-2', 'model-entity-3', 'model-entity-4'].forEach(id => {
            const entity = document.getElementById(id);
            if (entity) {
                entity.addEventListener('model-loaded', () => {
                    log('Entity', `${id} 模型实体加载成功 ✓`, 'load');
                    alignModelToMarker(id);
                    const markerId = id.split('-').pop();
                    const fallback = document.getElementById(`fallback-${markerId}`);
                    if (fallback) {
                        fallback.setAttribute('visible', 'false');
                    }
                });
                entity.addEventListener('model-error', (e) => {
                    const detailMessage = e && e.detail && e.detail.message ? e.detail.message : '未知错误';
                    log('Entity', `${id} 模型实体加载失败 ✗: ${detailMessage}`, 'error');
                });
            }
        });

        // AR.js 就绪后隐藏加载界面
        window.addEventListener('load', () => {
            log('Window', '页面加载完成', 'load');
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
                log('UI', '加载界面已隐藏', 'info');
            }, 3000);
        });

        // ========== NFT Marker 事件监听 ==========
        const nftMarkers = document.querySelectorAll('a-nft');
        log('NFT', `找到 ${nftMarkers.length} 个 NFT Marker 节点`, 'info');
        
        nftMarkers.forEach((marker, index) => {
            const markerId = index + 2;
            const markerUrl = marker.getAttribute('url');
            log('NFT', `Marker ${markerId}: ${markerUrl}`, 'info');
            
            // NFT 加载开始
            marker.addEventListener('arjs-nft-init', () => {
                log('NFT', `Marker ${markerId} NFT初始化中...`, 'load');
            });
            
            // NFT 加载完成
            marker.addEventListener('arjs-nft-loaded', () => {
                log('NFT', `Marker ${markerId} NFT描述文件加载成功 ✓`, 'load');
            });

            // NFT 加载错误
            marker.addEventListener('arjs-nft-error', (e) => {
                log('NFT', `Marker ${markerId} NFT加载失败 ✗: ${e.detail || '检查fset/fset3/iset文件'}`, 'error');
            });

            // Marker 被识别
            marker.addEventListener('markerFound', () => {
                log('Track', `Marker ${markerId} 识别成功 ★`, 'info');
                detectedMarkers.add(markerId);
                updateHint();
                updateDebug();
                
                // 打印调试信息：位置和缩放
                const worldPos = new THREE.Vector3();
                marker.object3D.getWorldPosition(worldPos);
                log('Debug', `Marker ${markerId} World Pos: ${worldPos.x.toFixed(2)}, ${worldPos.y.toFixed(2)}, ${worldPos.z.toFixed(2)}`, 'warn');
                
                // 检查子模型状态
                const childEntity = document.getElementById(`model-entity-${markerId}`);
                if (childEntity) {
                    childEntity.setAttribute('animation__float', 'enabled: true');
                    childEntity.object3D.visible = true;
                    // 不要强制重置 scale，保留 alignModelToMarker 的计算结果
                    // childEntity.setAttribute('scale', '50 50 50'); 
                    
                    // 检查模型是否加载（兼容 GLTF）
                    const hasModel = childEntity.object3D.children.length > 0;
                    log('Track', `Marker ${markerId} 子模型存在: ${hasModel}`, hasModel ? 'info' : 'warn');
                    
                    const helper = document.getElementById(`marker-helper-${markerId}`);
                    if (helper) {
                        // 调试完成，默认隐藏辅助方块，避免与模型冲突
                        helper.setAttribute('visible', 'false'); 
                    }
                    const fallback = document.getElementById(`fallback-${markerId}`);
                    if (fallback) {
                        // 既然模型已经加载，强制隐藏 fallback
                        fallback.setAttribute('visible', 'false');
                    }
                    
                    // 如果模型存在，再次尝试对齐（以防初次加载时未能正确对齐）
                    if (hasModel) {
                        alignModelToMarker(`model-entity-${markerId}`);
                    }
                }
                marker.object3D.visible = true;
                if (hudDebug) {
                    hudDebug.setAttribute('visible', 'true');
                    hudDebug.setAttribute('color', '#00ff00'); // 识别成功变绿
                }
                forceShowMarker(markerId);
            });

            // Marker 丢失
            marker.addEventListener('markerLost', () => {
                log('Track', `Marker ${markerId} 丢失`, 'warn');
                detectedMarkers.delete(markerId);
                updateHint();
                updateDebug();
                const childEntity = document.getElementById(`model-entity-${markerId}`);
                if (childEntity) {
                    childEntity.setAttribute('animation__float', 'enabled: false');
                }
                const helper = document.getElementById(`marker-helper-${markerId}`);
                if (helper) {
                    helper.setAttribute('visible', 'false');
                }
                const fallback = document.getElementById(`fallback-${markerId}`);
                if (fallback) {
                    fallback.setAttribute('visible', 'false');
                }
                if (hudDebug) {
                    hudDebug.setAttribute('visible', detectedMarkers.size > 0 ? 'true' : 'false');
                }
            });
        });

        // ========== 提示更新 ==========
        function updateHint() {
            if (detectedMarkers.size > 0) {
                const cards = Array.from(detectedMarkers).join(', ');
                hintOverlay.textContent = `已识别卡片: ${cards}`;
                hintOverlay.style.background = 'rgba(0, 200, 100, 0.7)';
            } else {
                hintOverlay.textContent = '请将摄像头对准卡片';
                hintOverlay.style.background = 'rgba(0, 0, 0, 0.7)';
            }
        }

        // ========== 调试信息更新 ==========
        function updateDebug() {
            if (!CONFIG.debug) return;
            const now = Date.now();
            if (now - lastDebugUpdateTime < PERF.debugPanelThrottleMs) return;
            lastDebugUpdateTime = now;
            debugDetected.textContent = detectedMarkers.size > 0 ? Array.from(detectedMarkers).join(', ') : '无';
            debugTracking.textContent = detectedMarkers.size > 0 ? '跟踪中' : '未跟踪';
        }

        function forceShowMarker(markerId) {
            const marker = document.querySelector(`a-nft[url="./assets/markers/${markerId}"]`);
            if (marker) {
                marker.setAttribute('visible', 'true');
                marker.object3D.visible = true;
                // 不要重置 scale，因为我们在 alignModelToMarker 里可能已经设置过了（如果是直接缩放 marker 的话，但这里我们通常缩放的是子 entity）
                // 不过为了保险起见，marker 本身应该是 1,1,1
                if (marker.object3D.scale.x === 0) {
                     marker.object3D.scale.set(1, 1, 1);
                }
            }
            // 移除强制显示 helper 和 fallback 的逻辑，完全由 markerFound 中的逻辑控制
        }

        window.toggleHelpers = function(enabled) {
            const helpers = document.querySelectorAll('[id^="marker-helper-"], [id^="fallback-"]');
            helpers.forEach(h => h.setAttribute('visible', enabled ? 'true' : 'false'));
        };

        // ========== 模型参数动态调整 ==========
        window.adjustModel = function(modelId, property, value) {
            const entity = document.getElementById(`model-entity-${modelId}`);
            if (entity) {
                entity.setAttribute(property, value);
                log('Adjust', `Model ${modelId}: ${property} = ${value}`, 'info');
            }
        };

        // ========== 调整模型大小（单位：米） ==========
        window.scaleModel = function(modelId, s) {
            const entity = document.getElementById(`model-entity-${modelId}`);
            if (entity) {
                entity.setAttribute('scale', `${s} ${s} ${s}`);
                log('Scale', `Model ${modelId} 缩放到 ${s}`, 'info');
            }
        };

        // ========== 调整模型方向 ==========
        window.rotateModel = function(modelId, x = -90, y = 0, z = 0) {
            const entity = document.getElementById(`model-entity-${modelId}`);
            if (entity) {
                entity.setAttribute('rotation', `${x} ${y} ${z}`);
                log('Rotate', `Model ${modelId} 旋转到 (${x}, ${y}, ${z})`, 'info');
            }
        };

        // ========== 获取当前模型状态 ==========
        window.getModelInfo = function(modelId) {
            const entity = document.getElementById(`model-entity-${modelId}`);
            if (entity) {
                const pos = entity.getAttribute('position');
                const rot = entity.getAttribute('rotation');
                const scale = entity.getAttribute('scale');
                log('Info', `Model ${modelId}: pos=(${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)}) rot=(${rot.x}, ${rot.y}, ${rot.z}) scale=${scale.x}`, 'info');
                return { position: pos, rotation: rot, scale: scale };
            }
        };

        // ========== 手动检查状态 ==========
        window.checkStatus = function() {
            log('Check', '========== 状态检查 ==========', 'info');
            
            // 检查资源
            ['model-2', 'model-3', 'model-4'].forEach(id => {
                const asset = document.getElementById(id);
                log('Check', `资源 ${id}: ${asset ? '存在' : '不存在'}`, asset ? 'info' : 'error');
            });
            
            // 检查模型实体
            ['model-entity-2', 'model-entity-3', 'model-entity-4'].forEach(id => {
                const entity = document.getElementById(id);
                if (entity) {
                    const mesh = entity.getObject3D('mesh');
                    log('Check', `实体 ${id}: mesh=${!!mesh}`, mesh ? 'info' : 'warn');
                } else {
                    log('Check', `实体 ${id}: 不存在`, 'error');
                }
            });
            
            // 检查NFT状态
            nftMarkers.forEach((marker, index) => {
                const markerId = index + 2;
                const markerVisible = marker && marker.object3D ? marker.object3D.visible : 'unknown';
                log('Check', `NFT ${markerId}: visible=${markerVisible}`, 'info');
            });
        };

        log('Init', 'AR 卡片召唤器初始化', 'info');
        log('Init', '控制台命令: checkStatus() 查看状态', 'info');
        log('Init', '控制台命令: scaleModel(id, size) 调整大小', 'info');
        log('Init', '控制台命令: rotateModel(id, x, y, z) 调整方向', 'info');
    </script>
</body>
</html>
