<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR动漫卡片召唤器</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.min.js"></script>
    <style>
        /* 加载界面 */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            font-family: Arial, sans-serif;
        }
        #loading-overlay.hidden {
            display: none;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading-text {
            font-size: 18px;
            margin-bottom: 10px;
        }
        #loading-progress {
            font-size: 14px;
            color: #888;
        }
        /* 提示信息 */
        #hint-overlay {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 100;
            transition: opacity 0.3s;
        }
        #hint-overlay.hidden {
            opacity: 0;
        }
        /* 调试面板 */
        #debug-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
            max-width: 200px;
        }
        #debug-panel.hidden {
            display: none;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- 加载界面 -->
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div id="loading-text">正在加载 AR 场景...</div>
        <div id="loading-progress">初始化中</div>
    </div>

    <!-- 用户提示 -->
    <div id="hint-overlay">请将摄像头对准卡片</div>

    <!-- 调试面板 -->
    <div id="debug-panel" class="hidden">
        <div>已识别卡片: <span id="debug-detected">无</span></div>
        <div>跟踪状态: <span id="debug-tracking">未跟踪</span></div>
    </div>

    <!-- AR 场景 -->
    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        gesture-detector
    >
        <!-- 资源预加载 -->
        <a-assets>
            <a-asset-item id="model-2" src="./assets/models/2.glb"></a-asset-item>
            <a-asset-item id="model-3" src="./assets/models/3.glb"></a-asset-item>
            <!-- 模型4暂无，后续添加 -->
        </a-assets>

        <!-- 卡片2 的 NFT Marker -->
        <a-nft
            type="nft"
            url="./assets/markers/2"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
        >
            <a-entity
                id="model-entity-2"
                gltf-model="#model-2"
                position="100 100 0"
                scale="150 150 150"
                rotation="-90 0 0"
                class="clickable"
                animation__float="property: position; to: 100 120 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"
            >
            </a-entity>
        </a-nft>

        <!-- 卡片3 的 NFT Marker -->
        <a-nft
            type="nft"
            url="./assets/markers/3"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
        >
            <a-entity
                id="model-entity-3"
                gltf-model="#model-3"
                position="100 100 0"
                scale="150 150 150"
                rotation="-90 0 0"
                animation__float="property: position; to: 100 120 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"
            >
            </a-entity>
        </a-nft>

        <!-- 卡片4 的 NFT Marker（模型待添加） -->
        <a-nft
            type="nft"
            url="./assets/markers/4"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
        >
            <a-entity
                id="model-entity-4"
                position="100 100 0"
                scale="150 150 150"
                rotation="-90 0 0"
            >
                <!-- 暂用占位几何体，待替换为实际模型 -->
                <a-box color="#4CC3D9" depth="50" height="50" width="50"></a-box>
            </a-entity>
        </a-nft>

        <!-- 摄像头 -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // ========== 配置参数 ==========
        const CONFIG = {
            // 模型参数配置（方便调优）
            models: {
                2: { position: '100 100 0', scale: '150 150 150', rotation: '-90 0 0' },
                3: { position: '100 100 0', scale: '150 150 150', rotation: '-90 0 0' },
                4: { position: '100 100 0', scale: '150 150 150', rotation: '-90 0 0' }
            },
            // 跟踪优化参数
            tracking: {
                smooth: true,
                smoothCount: 10,        // 平滑帧数，值越大越稳定但延迟越高
                smoothTolerance: 0.01,  // 位置容差
                smoothThreshold: 5      // 阈值
            },
            // 调试模式
            debug: false
        };

        // ========== 加载状态管理 ==========
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const loadingProgress = document.getElementById('loading-progress');
        const hintOverlay = document.getElementById('hint-overlay');
        const debugPanel = document.getElementById('debug-panel');
        const debugDetected = document.getElementById('debug-detected');
        const debugTracking = document.getElementById('debug-tracking');

        // 调试模式开关
        if (CONFIG.debug) {
            debugPanel.classList.remove('hidden');
        }

        // 跟踪状态
        let detectedMarkers = new Set();

        // ========== 场景加载事件 ==========
        const scene = document.querySelector('a-scene');
        
        scene.addEventListener('loaded', () => {
            loadingProgress.textContent = '场景已加载';
        });

        scene.addEventListener('arjs-video-loaded', () => {
            loadingProgress.textContent = '摄像头已就绪';
        });

        // AR.js 就绪后隐藏加载界面
        window.addEventListener('load', () => {
            // 给 AR.js 一些初始化时间
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, 3000);
        });

        // ========== NFT Marker 事件监听 ==========
        const nftMarkers = document.querySelectorAll('a-nft');
        
        nftMarkers.forEach((marker, index) => {
            const markerId = index + 2; // 从2开始
            
            // Marker 被识别
            marker.addEventListener('markerFound', () => {
                console.log(`Marker ${markerId} found`);
                detectedMarkers.add(markerId);
                updateHint();
                updateDebug();
            });

            // Marker 丢失
            marker.addEventListener('markerLost', () => {
                console.log(`Marker ${markerId} lost`);
                detectedMarkers.delete(markerId);
                updateHint();
                updateDebug();
            });
        });

        // ========== 提示更新 ==========
        function updateHint() {
            if (detectedMarkers.size > 0) {
                const cards = Array.from(detectedMarkers).join(', ');
                hintOverlay.textContent = `已识别卡片: ${cards}`;
                hintOverlay.style.background = 'rgba(0, 200, 100, 0.7)';
            } else {
                hintOverlay.textContent = '请将摄像头对准卡片';
                hintOverlay.style.background = 'rgba(0, 0, 0, 0.7)';
            }
        }

        // ========== 调试信息更新 ==========
        function updateDebug() {
            if (!CONFIG.debug) return;
            debugDetected.textContent = detectedMarkers.size > 0 ? Array.from(detectedMarkers).join(', ') : '无';
            debugTracking.textContent = detectedMarkers.size > 0 ? '跟踪中' : '未跟踪';
        }

        // ========== 模型参数动态调整（开发调试用） ==========
        window.adjustModel = function(modelId, property, value) {
            const entity = document.getElementById(`model-entity-${modelId}`);
            if (entity) {
                entity.setAttribute(property, value);
                console.log(`Model ${modelId}: ${property} = ${value}`);
            }
        };

        // 使用示例（在控制台调用）：
        // adjustModel(2, 'position', '100 150 0')
        // adjustModel(2, 'scale', '200 200 200')
        // adjustModel(2, 'rotation', '-90 45 0')

        console.log('AR 卡片召唤器已就绪');
        console.log('调试命令: adjustModel(卡片ID, 属性, 值)');
        console.log('示例: adjustModel(2, "scale", "200 200 200")');
    </script>
</body>
</html>
